<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio — Premium Wooden Player</title>

<style>
body {
  background:#222;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* === Radio Premium Box === */
.radio-box {
  width: 460px;
  padding: 30px;
  border-radius: 25px;
  background: url('https://bambangw.github.io/radio-stream/logo2.jpg');
  background-size: cover;
  background-position:center;
  box-shadow:
    0 0 25px rgba(0,0,0,.6),
    inset 0 0 40px rgba(0,0,0,.4);
  border: 7px solid #3b2713;
  text-align:center;
  color:#f9e7c9;
}

/* === Judul === */
.radio-title {
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
  text-shadow:0 0 5px rgba(0,0,0,.7);
}

/* === Lampu indikator === */
.light {
  width:20px;
  height:20px;
  background:#800;
  border-radius:50%;
  margin:10px auto 20px;
  box-shadow:0 0 10px #b00;
}

.light.on {
  background:#3aff57;
  box-shadow:0 0 12px #3aff57;
}

/* === Tombol Play/Pause === */
.btn-pp {
  width:95px;
  height:95px;
  background:#c49b63;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:30px;
  box-shadow:
    0 0 10px rgba(0,0,0,.6),
    inset 0 0 12px rgba(255,255,255,.3);
  margin:20px auto;
  color:white;
  transition:.2s;
}

.btn-pp:hover {
  transform:scale(1.08);
}

/* === VU METER LED === */
.vu-container {
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:25px;
}

.led {
  width:8px;
  height:30px;
  background:#330000;
  border-radius:3px;
  transition:height .1s ease, background .1s ease;
  box-shadow:0 0 3px #000;
}
</style>
</head>

<body>

<div class="radio-box">

  <div class="radio-title">📻 Musik Nostalgia</div>

  <div id="lamp" class="light"></div>

  <div id="ppBtn" class="btn-pp">▶</div>

  <!-- VU METER -->
  <div class="vu-container">
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
  </div>

  <audio id="radio" preload="auto" crossorigin="anonymous"></audio>

</div>

<script>
// ================= KONFIGURASI =================
const STREAM_URL = "https://b.alhastream.com:5044/radio";

const RETRY_BASE = 3000;      // 3 detik awal
const RETRY_MAX  = 30000;     // max 30 detik
const FREEZE_TIME = 15000;    // 15 detik audio diam = reconnect

// ================= ELEMENT =================
const audio = document.getElementById("radio");
const lamp  = document.getElementById("lamp");
const btn   = document.getElementById("ppBtn");
const leds  = document.querySelectorAll(".led");

audio.src = STREAM_URL;
audio.preload = "none";

// ================= STATE =================
let audioCtx, sourceNode, analyser, dataArray;
let isPlaying = false;
let retryDelay = RETRY_BASE;
let lastTime = 0;

// ================= PLAY / PAUSE =================
btn.onclick = async () => {
  if (!audioCtx) setupAudio();

  if (!isPlaying) {
    try {
      await audio.play();
      lamp.classList.add("on");
      btn.textContent = "⏸";
      isPlaying = true;
    } catch (e) {
      scheduleReconnect();
    }
  } else {
    audio.pause();
    lamp.classList.remove("on");
    btn.textContent = "▶";
    isPlaying = false;
  }
};

// ================= AUDIO CONTEXT =================
function setupAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({
    latencyHint: "playback"
  });

  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;

  dataArray = new Uint8Array(analyser.frequencyBinCount);

  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  animateVU();
}

// ================= VU METER =================
function animateVU() {
  requestAnimationFrame(animateVU);
  if (!analyser || !isPlaying) return;

  analyser.getByteFrequencyData(dataArray);

  leds.forEach((led, i) => {
    let v = dataArray[i] || 0;
    let h = 10 + (v / 255) * 30;
    led.style.height = h + "px";

    led.style.background =
      v > 180 ? "#33ff33" :
      v > 120 ? "#ff0000" :
      v > 60  ? "#0000ff" :
                "#225500";
  });
}

// ================= RECONNECT CORE =================
function hardResetAudio() {
  audio.pause();
  audio.src = "";
  audio.load();
  audio.src = STREAM_URL + "?t=" + Date.now(); // cache busting
  audio.load();
}

function reconnect() {
  lamp.classList.remove("on");
  btn.textContent = "▶";
  isPlaying = false;

  hardResetAudio();

  setTimeout(async () => {
    try {
      await audio.play();
      lamp.classList.add("on");
      btn.textContent = "⏸";
      isPlaying = true;
      retryDelay = RETRY_BASE; // reset jika sukses
    } catch {
      scheduleReconnect();
    }
  }, 500);
}

function scheduleReconnect() {
  setTimeout(reconnect, retryDelay);
  retryDelay = Math.min(retryDelay * 1.8, RETRY_MAX);
}

// ================= EVENT LISTENER =================
audio.addEventListener("error", scheduleReconnect);
audio.addEventListener("stalled", scheduleReconnect);
audio.addEventListener("ended", scheduleReconnect);
audio.addEventListener("waiting", scheduleReconnect);

audio.addEventListener("playing", () => {
  lamp.classList.add("on");
  btn.textContent = "⏸";
  isPlaying = true;
  retryDelay = RETRY_BASE;
});

// ================= FREEZE DETECTOR =================
setInterval(() => {
  if (!isPlaying) return;

  if (audio.currentTime === lastTime) {
    scheduleReconnect();
  }
  lastTime = audio.currentTime;
}, FREEZE_TIME);
</script>


</body>
</html>
