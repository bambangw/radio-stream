<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio — Premium Wood Classic Player</title>

<style>
body {
  font-family: 'Arial', sans-serif;
  background:#1a1a1a;
  margin:0;
  padding:40px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ---- BOX RADIO KAYU PREMIUM ---- */
.radio-box {
  width: 460px;
  padding: 30px;
  border-radius: 25px;
  background: url('https://bambangw.github.io/radio-stream/logo2.jpg');
  background-size: cover;
  box-shadow: 0 0 35px rgba(0,0,0,.7), inset 0 0 15px rgba(0,0,0,.5);
  border: 7px solid #3d2b17;
  text-align:center;
  backdrop-filter: blur(2px);
}

/* ---- TITLE ---- */
.radio-title {
  font-size:28px;
  color:#ffebc4;
  margin-bottom:15px;
  text-shadow:0 0 6px rgba(0,0,0,.7);
}

/* ---- LAMPU ON AIR ---- */
.light {
  width:20px;
  height:20px;
  background:#a00;
  border-radius:50%;
  margin:10px auto 20px;
  box-shadow:0 0 12px #600;
}

.light.on {
  background:#3aff57;
  box-shadow:0 0 15px #3aff57;
}

/* ---- TOMBOL PLAY / PAUSE ---- */
.btn {
  width:90px;
  height:90px;
  background:#c49a60;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  color:#fff;
  font-size:32px;
  font-weight:bold;
  margin:25px auto;
  box-shadow:0 0 12px rgba(0,0,0,.5), inset 0 0 12px rgba(255,255,255,.25);
  transition:.2s;
}
.btn:hover { transform:scale(1.1); }

/* ---- VU METER LED ---- */
.vu-wrapper {
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.led {
  width:10px;
  height:40px;
  background:#222;
  margin:0 2px;
  border-radius:4px;
  box-shadow: inset 0 0 6px rgba(0,0,0,.7);
  transition:0.1s;
}

.note {
  margin-top:20px;
  font-size:12px;
  color:#fff;
  opacity:.7;
}
</style>
</head>

<body>

<div class="radio-box">

  <div class="radio-title">📻 Haza Radio Premium</div>

  <div id="lamp" class="light"></div>

  <div id="playbtn" class="btn">▶</div>

  <!-- VU METER -->
  <div class="vu-wrapper">
    <div class="led" id="l1"></div>
    <div class="led" id="l2"></div>
    <div class="led" id="l3"></div>
    <div class="led" id="l4"></div>
    <div class="led" id="l5"></div>
    <div class="led" id="l6"></div>
    <div class="led" id="l7"></div>
    <div class="led" id="l8"></div>
    <div class="led" id="l9"></div>
    <div class="led" id="l10"></div>
  </div>

  <div class="note">Streaming Retro Premium — Auto Reconnect + VU Visualizer</div>

  <audio id="radio" preload="auto" crossorigin="anonymous"></audio>

</div>

<script>
// === STREAM CONFIG ===
const STREAM_URL = "https://b.alhastream.com:5044/radio";
const RETRY_DELAY = 3000;
const audio = document.getElementById("radio");
audio.src = STREAM_URL;

let audioCtx, sourceNode, analyser, dataArray;
let playing = false;

const lamp = document.getElementById("lamp");
const playBtn = document.getElementById("playbtn");

// === START / PAUSE ===
playBtn.onclick = function() {
    if (!playing) startRadio();
    else pauseRadio();
};

function startRadio() {
    if (!audioCtx) {
        audioCtx = new AudioContext({ latencyHint:"playback" });
        sourceNode = audioCtx.createMediaElementSource(audio);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    audio.play().then(() => {
        playing = true;
        lamp.classList.add("on");
        playBtn.innerHTML = "⏸";
    });
}

function pauseRadio() {
    audio.pause();
    playing = false;
    lamp.classList.remove("on");
    playBtn.innerHTML = "▶";
}

// === AUTO RECONNECT ===
function reconnect() {
  lamp.classList.remove("on");
  audio.pause();
  audio.src = STREAM_URL;
  audio.load();

  setTimeout(() => {
    audio.play().then(() => {
      lamp.classList.add("on");
      playBtn.innerHTML = "⏸";
      playing = true;
    });
  }, 600);
}

audio.addEventListener("error", () => setTimeout(reconnect, RETRY_DELAY));
audio.addEventListener("stalled", () => setTimeout(reconnect, RETRY_DELAY));
audio.addEventListener("ended", () => setTimeout(reconnect, RETRY_DELAY));

setInterval(() => {
  if (audio.readyState < 2 || audio.paused && playing) reconnect();
}, 10000);

// === VU METER ===
const leds = [];
for (let i=1; i<=10; i++) leds.push(document.getElementById("l"+i));

function animateVU() {
  requestAnimationFrame(animateVU);

  if (!analyser) return;

  analyser.getByteFrequencyData(dataArray);
  let level = Math.floor((dataArray[2] + dataArray[5] + dataArray[10]) / 3 / 25);
  if (level > 10) level = 10;

  leds.forEach((led, index) => {
    if (index < level) led.style.background = "#3aff57";
    else led.style.background = "#222";
  });
}
animateVU();
</script>

</body>
</html>
