<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio V5</title>

<style>

body{
background:#1b1b1b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial;
}

/* RADIO BODY */

.radio{
width:520px;
height:300px;
background:linear-gradient(#7b532b,#4a2f16);
border-radius:25px;
box-shadow:
0 0 40px rgba(0,0,0,.8),
inset 0 0 40px rgba(0,0,0,.5);
border:8px solid #2d1b0f;
padding:20px;
color:#ffe9b3;
position:relative;
}

/* RADIO TITLE */

.title{
text-align:center;
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

/* SPEAKER */

.speaker{
position:absolute;
right:25px;
top:70px;
width:140px;
height:140px;
background:
radial-gradient(#111,#000);
border-radius:50%;
box-shadow:
inset 0 0 20px #000,
0 0 10px #000;
}

/* DIAL WINDOW */

.dial{
width:280px;
height:80px;
background:#111;
border-radius:10px;
margin-top:10px;
position:relative;
overflow:hidden;
border:3px solid #000;
}

/* FREQUENCY SCALE */

.scale{
position:absolute;
width:200%;
height:100%;
background:
repeating-linear-gradient(
to right,
transparent,
transparent 28px,
#999 30px
);
animation:dialmove 8s linear infinite;
opacity:.6;
}

@keyframes dialmove{
0%{transform:translateX(0)}
100%{transform:translateX(-50%)}
}

/* DIAL NEEDLE */

.needle{
position:absolute;
left:50%;
top:0;
width:2px;
height:100%;
background:#ff3b3b;
box-shadow:0 0 6px red;
}

/* PLAY BUTTON */

.play{
margin-top:20px;
width:90px;
height:90px;
border-radius:50%;
background:#c49b63;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
cursor:pointer;
box-shadow:
0 0 10px #000,
inset 0 0 10px rgba(255,255,255,.4);
}

/* POWER LIGHT */

.light{
position:absolute;
left:20px;
top:20px;
width:18px;
height:18px;
background:#600;
border-radius:50%;
box-shadow:0 0 8px #900;
}

.light.on{
background:#3aff57;
box-shadow:0 0 12px #3aff57;
}

/* VU METER */

.vu{
display:flex;
gap:4px;
margin-top:15px;
}

.led{
width:8px;
height:20px;
background:#330000;
border-radius:2px;
}

/* SONG TEXT */

.song{
margin-top:10px;
font-size:14px;
white-space:nowrap;
overflow:hidden;
}

.song span{
display:inline-block;
padding-left:100%;
animation:scroll 10s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

</style>
</head>

<body>

<div class="radio">

<div class="light" id="lamp"></div>

<div class="title">📻 Haza Radio</div>

<div class="dial">
<div class="scale"></div>
<div class="needle"></div>
</div>

<div style="display:flex;gap:20px;align-items:center">

<div id="playBtn" class="play">▶</div>

<div>

<div id="status">Siap Memutar</div>

<div class="song">
<span id="songTitle">Haza Radio Nostalgia</span>
</div>

<div class="vu" id="vu">
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
</div>

</div>

</div>

<div class="speaker"></div>

<audio id="audio"></audio>

</div>

<script>

const STREAM="https://b.alhastream.com:5044/radio";

const audio=document.getElementById("audio");
const btn=document.getElementById("playBtn");
const lamp=document.getElementById("lamp");
const leds=document.querySelectorAll(".led");

let ctx, analyser, data;

audio.src=STREAM;

btn.onclick=async()=>{

if(!ctx){

ctx=new AudioContext();
const src=ctx.createMediaElementSource(audio);

analyser=ctx.createAnalyser();
analyser.fftSize=64;

data=new Uint8Array(analyser.frequencyBinCount);

src.connect(analyser);
analyser.connect(ctx.destination);

animate();

}

if(audio.paused){

await audio.play();

lamp.classList.add("on");

btn.textContent="❚❚";

}else{

audio.pause();

lamp.classList.remove("on");

btn.textContent="▶";

}

}

function animate(){

requestAnimationFrame(animate);

if(!analyser) return;

analyser.getByteFrequencyData(data);

leds.forEach((led,i)=>{

let v=data[i];

led.style.height=(10+(v/255)*25)+"px";

led.style.background=
v>200?"#33ff33":
v>140?"#ff0000":
v>80?"#ffaa00":
"#330000";

});

}

</script>

</body>
</html>
