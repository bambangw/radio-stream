<script>
// ================= KONFIGURASI =================
const STREAM_URL = "https://b.alhastream.com:5044/radio";

const RETRY_BASE = 3000;      // 3 detik awal
const RETRY_MAX  = 30000;     // max 30 detik
const FREEZE_TIME = 15000;    // 15 detik audio diam = reconnect

// ================= ELEMENT =================
const audio = document.getElementById("radio");
const lamp  = document.getElementById("lamp");
const btn   = document.getElementById("ppBtn");
const leds  = document.querySelectorAll(".led");

audio.src = STREAM_URL;
audio.preload = "none";

// ================= STATE =================
let audioCtx, sourceNode, analyser, dataArray;
let isPlaying = false;
let retryDelay = RETRY_BASE;
let lastTime = 0;

// ================= PLAY / PAUSE =================
btn.onclick = async () => {
  if (!audioCtx) setupAudio();

  if (!isPlaying) {
    try {
      await audio.play();
      lamp.classList.add("on");
      btn.textContent = "⏸";
      isPlaying = true;
    } catch (e) {
      scheduleReconnect();
    }
  } else {
    audio.pause();
    lamp.classList.remove("on");
    btn.textContent = "▶";
    isPlaying = false;
  }
};

// ================= AUDIO CONTEXT =================
function setupAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({
    latencyHint: "playback"
  });

  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;

  dataArray = new Uint8Array(analyser.frequencyBinCount);

  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  animateVU();
}

// ================= VU METER =================
function animateVU() {
  requestAnimationFrame(animateVU);
  if (!analyser || !isPlaying) return;

  analyser.getByteFrequencyData(dataArray);

  leds.forEach((led, i) => {
    let v = dataArray[i] || 0;
    let h = 10 + (v / 255) * 30;
    led.style.height = h + "px";

    led.style.background =
      v > 180 ? "#33ff33" :
      v > 120 ? "#ff0000" :
      v > 60  ? "#0000ff" :
                "#225500";
  });
}

// ================= RECONNECT CORE =================
function hardResetAudio() {
  audio.pause();
  audio.src = "";
  audio.load();
  audio.src = STREAM_URL + "?t=" + Date.now(); // cache busting
  audio.load();
}

function reconnect() {
  lamp.classList.remove("on");
  btn.textContent = "▶";
  isPlaying = false;

  hardResetAudio();

  setTimeout(async () => {
    try {
      await audio.play();
      lamp.classList.add("on");
      btn.textContent = "⏸";
      isPlaying = true;
      retryDelay = RETRY_BASE; // reset jika sukses
    } catch {
      scheduleReconnect();
    }
  }, 500);
}

function scheduleReconnect() {
  setTimeout(reconnect, retryDelay);
  retryDelay = Math.min(retryDelay * 1.8, RETRY_MAX);
}

// ================= EVENT LISTENER =================
audio.addEventListener("error", scheduleReconnect);
audio.addEventListener("stalled", scheduleReconnect);
audio.addEventListener("ended", scheduleReconnect);
audio.addEventListener("waiting", scheduleReconnect);

audio.addEventListener("playing", () => {
  lamp.classList.add("on");
  btn.textContent = "⏸";
  isPlaying = true;
  retryDelay = RETRY_BASE;
});

// ================= FREEZE DETECTOR =================
setInterval(() => {
  if (!isPlaying) return;

  if (audio.currentTime === lastTime) {
    scheduleReconnect();
  }
  lastTime = audio.currentTime;
}, FREEZE_TIME);
</script>
