<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio — Premium Wooden Player</title>

<style>
body {
  background:#222;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* === Radio Premium Box === */
.radio-box {
  width: 460px;
  padding: 30px;
  border-radius: 25px;
  background: url('https://bambangw.github.io/radio-stream/logo3.jpg');
  background-size: cover;
  background-position:center;
  box-shadow:
    0 0 25px rgba(0,0,0,.6),
    inset 0 0 40px rgba(0,0,0,.4);
  border: 7px solid #3b2713;
  text-align:center;
  color:#f9e7c9;
}

/* === Judul === */
.radio-title {
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
  text-shadow:0 0 5px rgba(0,0,0,.7);
}

/* === Lampu indikator === */
.light {
  width:20px;
  height:20px;
  background:#800;
  border-radius:50%;
  margin:10px auto 20px;
  box-shadow:0 0 10px #b00;
}

.light.on {
  background:#3aff57;
  box-shadow:0 0 12px #3aff57;
}

/* === Tombol Play/Pause === */
.btn-pp {
  width:95px;
  height:95px;
  background:#c49b63;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:30px;
  box-shadow:
    0 0 10px rgba(0,0,0,.6),
    inset 0 0 12px rgba(255,255,255,.3);
  margin:20px auto;
  color:white;
  transition:.2s;
}

.btn-pp:hover {
  transform:scale(1.08);
}

/* === VU METER LED === */
.vu-container {
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:25px;
}

.led {
  width:8px;
  height:30px;
  background:#330000;
  border-radius:3px;
  transition:height .1s ease, background .1s ease;
  box-shadow:0 0 3px #000;
}
</style>
</head>

<body>

<div class="radio-box">

  <div class="radio-title">📻 Musik Nostalgia</div>

  <div id="lamp" class="light"></div>

  <div style="display:flex;align-items:center;justify-content:center;gap:15px;">

  <div id="ppBtn" class="btn-pp">▶</div>

  <div id="streamInfo" style="
    width:180px;
    text-align:left;
    font-size:13px;
    color:#ffe9b3;
    text-shadow:0 0 5px #000;
    line-height:1.4;
  ">
    <div id="radioStatus">⏳ Monggo Pinarak</div>
    <div id="songTitle" style="font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
      —
    </div>
  </div>

</div>


<div id="bufferStatus" style="
  margin-top:10px;
  font-size:14px;
  color:#ffe9b3;
  text-shadow:0 0 5px #000;
  display:none;">
  Buffering 0%
</div>
<div id="bitrateStatus" style="
  margin-top:4px;
  font-size:13px;
  color:#9dff9d;
  text-shadow:0 0 5px #000;
  display:none;">
  Bitrate: -- kbps
</div>



  <!-- VU METER -->
  <div class="vu-container">
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
  </div>

  <audio id="radio" preload="auto" crossorigin="anonymous"></audio>

</div>

<script>
// ================= KONFIGURASI =================
const STREAM_URL = "https://b.alhastream.com:5044/radio";

const RETRY_BASE = 3000;
const RETRY_MAX  = 30000;
const FREEZE_TIME = 15000;

// ================= ELEMENT =================
const audio = document.getElementById("radio");
const lamp  = document.getElementById("lamp");
const btn   = document.getElementById("ppBtn");
const leds  = document.querySelectorAll(".led");
const bufferTxt = document.getElementById("bufferStatus");

audio.src = STREAM_URL;
audio.preload = "none";

// ================= STATE =================
let audioCtx, sourceNode, analyser, dataArray;
let isPlaying = false;
let retryDelay = RETRY_BASE;
let lastTime = 0;

// ================= PLAY / PAUSE =================
btn.onclick = async () => {
  if (!audioCtx) setupAudio();

  if (!isPlaying) {
    showBuffer(0);
    try {
      await audio.play();
    } catch {
      scheduleReconnect();
    }
  } else {
    audio.pause();
    lamp.classList.remove("on");
    btn.textContent = "▶";
    isPlaying = false;
  }
};

// ================= AUDIO CONTEXT =================
function setupAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({
    latencyHint:"playback"
  });

  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;

  dataArray = new Uint8Array(analyser.frequencyBinCount);

  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  animateVU();
}

// ================= VU METER =================
function animateVU() {
  requestAnimationFrame(animateVU);
  if (!analyser || !isPlaying) return;

  analyser.getByteFrequencyData(dataArray);
  leds.forEach((led, i) => {
    let v = dataArray[i] || 0;
    let h = 10 + (v / 255) * 30;
    led.style.height = h + "px";
    led.style.background =
      v > 180 ? "#33ff33" :
      v > 120 ? "#ff0000" :
      v > 60  ? "#0000ff" :
                "#225500";
  });
}

// ================= BUFFER DISPLAY =================
function showBuffer(p) {
  bufferTxt.style.display = "block";
  bufferTxt.textContent = `Buffering ${p}%`;
}

function hideBuffer() {
  bufferTxt.style.display = "none";
}

// ================= RECONNECT =================
function hardResetAudio() {
  audio.pause();
  audio.src = "";
  audio.load();
  audio.src = STREAM_URL + "?t=" + Date.now();
  audio.load();
}

function reconnect() {
  isPlaying = false;
  lamp.classList.remove("on");
  btn.textContent = "▶";
  showBuffer(0);

  hardResetAudio();

  setTimeout(async () => {
    try {
      await audio.play();
    } catch {
      scheduleReconnect();
    }
  }, 500);
}

function scheduleReconnect() {
  showBuffer(0);
  setTimeout(reconnect, retryDelay);
  retryDelay = Math.min(retryDelay * 1.8, RETRY_MAX);
}

// ================= EVENT AUDIO =================
audio.addEventListener("waiting", () => showBuffer(10));
audio.addEventListener("stalled", () => showBuffer(20));
audio.addEventListener("canplay", () => showBuffer(70));
audio.addEventListener("canplaythrough", () => showBuffer(100));

audio.addEventListener("playing", () => {
  hideBuffer();
  lamp.classList.add("on");
  btn.textContent = "⏸";
  isPlaying = true;
  retryDelay = RETRY_BASE;
});

audio.addEventListener("error", scheduleReconnect);
audio.addEventListener("ended", scheduleReconnect);

// ================= FREEZE DETECTOR =================
setInterval(() => {
  if (!isPlaying) return;
  if (audio.currentTime === lastTime) scheduleReconnect();
  lastTime = audio.currentTime;
}, FREEZE_TIME);

// ================= BITRATE ESTIMATOR =================
const bitrateTxt = document.getElementById("bitrateStatus");

let lastBytes = 0;
let lastBitrateTime = Date.now();

function showBitrate(kbps) {
  bitrateTxt.style.display = "block";
  bitrateTxt.textContent = `Bitrate: ${kbps} kbps`;
}

function hideBitrate() {
  bitrateTxt.style.display = "none";
}

// Estimasi bitrate dari buffered data
setInterval(() => {
  if (!audio || audio.readyState < 2 || audio.paused) return;

  try {
    if (audio.buffered.length) {
      const bufferedEnd = audio.buffered.end(0);
      const now = Date.now();
      const deltaTime = (now - lastBitrateTime) / 1000;

      if (deltaTime > 0) {
        // asumsi audio 16-bit stereo
        const estimatedBytes =
          bufferedEnd * 44100 * 2 * 2;

        const deltaBytes = estimatedBytes - lastBytes;
        const kbps = Math.max(
          32,
          Math.round((deltaBytes * 8) / 1000 / deltaTime)
        );

        showBitrate(kbps);

        lastBytes = estimatedBytes;
        lastBitrateTime = now;
      }
    }
  } catch {}
}, 2000);

// ================= EVENT HANDLING =================
audio.addEventListener("playing", () => {
  bitrateTxt.style.display = "block";
});

audio.addEventListener("waiting", hideBitrate);
audio.addEventListener("stalled", hideBitrate);
audio.addEventListener("error", hideBitrate);
audio.addEventListener("ended", hideBitrate);
</script>


<script>
// ================= STREAM INFO =================

// GANTI jika mount point berbeda
const ICECAST_STATUS_URL =
  "https://b.alhastream.com:5044/status-json.xsl";

const radioStatus = document.getElementById("radioStatus");
const songTitle   = document.getElementById("songTitle");

// ================= STATUS HANDLER =================
function setStatus(txt) {
  radioStatus.textContent = txt;
}

// ================= FETCH METADATA =================
async function fetchMetadata() {
  try {
    const res = await fetch(ICECAST_STATUS_URL, { cache: "no-store" });
    const data = await res.json();

    let source = data.icestats.source;
    if (Array.isArray(source)) {
      source = source[0]; // ambil mount pertama
    }

    if (source) {
      songTitle.textContent =
        source.title || source.song || "Audio Stereo";
    }
  } catch {
    songTitle.textContent = "—";
  }
}

// ================= UPDATE LOOP =================
setInterval(fetchMetadata, 8000);

// ================= AUDIO STATUS SYNC =================
audio.addEventListener("playing", () => {
  setStatus("🔴 LIVE");
  fetchMetadata();
});

audio.addEventListener("waiting", () => {
  setStatus("⏳ Sabar Lurr");
});

audio.addEventListener("stalled", () => {
  setStatus("🔄 Reconnecting…");
});

audio.addEventListener("error", () => {
  setStatus("❌ Menunggu Jaringan");
});

audio.addEventListener("pause", () => {
  setStatus("⏸ Ngopi rumiyin");
});
</script>






</body>
</html>
