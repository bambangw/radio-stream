<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Haza Radio V6</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#222">

<style>

body{
background:#222;
font-family:Arial;
margin:0;
display:flex;
justify-content:center;
padding-top:25px;
color:#ffe9b3;
}

.radio-box{

width:420px;
padding:30px;

border-radius:25px;

background:url('https://bambangw.github.io/radio-stream/889.jpg');
background-size:cover;

box-shadow:
0 0 25px rgba(0,0,0,.7),
inset 0 0 40px rgba(0,0,0,.4);

border:7px solid #3b2713;

text-align:center;

}

.radio-title{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.light{

width:18px;
height:18px;

background:#800;

border-radius:50%;

margin:10px auto;

}

.light.on{

background:#3aff57;
box-shadow:0 0 12px #3aff57;

}

.btn{

width:90px;
height:90px;

border-radius:50%;

background:#c49b63;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;
cursor:pointer;

margin:15px auto;

}

.status{

margin-top:10px;
font-size:14px;

}

</style>
</head>

<body>

<div class="radio-box">

<div class="radio-title">📻 Musik Nostalgia</div>

<div id="lamp" class="light"></div>

<div id="playBtn" class="btn">▶</div>

<div id="radioStatus" class="status">
Selamat Datang
</div>

<div id="songTitle" class="status">
Audio Stereo
</div>

<audio
id="radio"
preload="none"
playsinline
webkit-playsinline
crossorigin="anonymous">
</audio>

</div>


<script>

/* ================= MULTI SERVER ================= */

const STREAMS = [

"https://b.alhastream.com:5044/radio",
"https://b.alhastream.com:5044/radio",
"https://b.alhastream.com:5044/radio"

];


/* ================= METADATA ================= */

const META_URL =
"https://b.alhastream.com:5044/status-json.xsl";


/* ================= ELEMENT ================= */

const audio=document.getElementById("radio");
const btn=document.getElementById("playBtn");
const lamp=document.getElementById("lamp");

const statusTxt=document.getElementById("radioStatus");
const songTxt=document.getElementById("songTitle");


/* ================= STATE ================= */

let playing=false;

let serverIndex=0;

let retryDelay=3000;

let lastTime=0;


/* ================= STREAM SELECT ================= */

function loadStream(){

const url=STREAMS[serverIndex]+"?nocache="+Date.now();

audio.src=url;

}


/* ================= SWITCH SERVER ================= */

function nextServer(){

serverIndex++;

if(serverIndex>=STREAMS.length){

serverIndex=0;

}

statusTxt.textContent="Switch Server...";

loadStream();

}


/* ================= PLAY ================= */

btn.onclick=async()=>{

if(!playing){

statusTxt.textContent="Menghubungkan...";

loadStream();

try{

await audio.play();

}catch{

reconnect();

}

}else{

audio.pause();

lamp.classList.remove("on");

btn.textContent="▶";

playing=false;

}

};


/* ================= RECONNECT ================= */

function reconnect(){

nextServer();

setTimeout(()=>{

audio.play().catch(()=>{});

},retryDelay);

retryDelay=Math.min(retryDelay*1.5,20000);

}


/* ================= EVENTS ================= */

audio.addEventListener("playing",()=>{

playing=true;

lamp.classList.add("on");

btn.textContent="🚀";

statusTxt.textContent="🔴 LIVE";

retryDelay=3000;

});


audio.addEventListener("waiting",()=>{

statusTxt.textContent="Buffering...";

});


audio.addEventListener("error",reconnect);

audio.addEventListener("stalled",reconnect);

audio.addEventListener("ended",reconnect);


/* ================= FREEZE DETECTOR ================= */

setInterval(()=>{

if(!playing) return;

if(audio.currentTime===lastTime){

reconnect();

}

lastTime=audio.currentTime;

},15000);


/* ================= NETWORK ================= */

window.addEventListener("online",reconnect);

window.addEventListener("offline",()=>{

statusTxt.textContent="Menunggu jaringan";

});


/* ================= METADATA ================= */

async function metadata(){

try{

const res=await fetch(META_URL,{cache:"no-store"});

const data=await res.json();

let src=data.icestats.source;

if(Array.isArray(src)) src=src[0];

songTxt.textContent=
src.title||
src.song||
"Streaming Audio";

}catch{}

}

setInterval(metadata,10000);

</script>

</body>
</html>
