<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio — Premium Wooden Player</title>

<style>
body {
  background:#222;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* === Radio Premium Box === */
.radio-box {
  width:460px;
  padding:30px;
  border-radius:25px;
  background:url('https://bambangw.github.io/radio-stream/logo2.jpg') center/cover;
  box-shadow:0 0 25px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.4);
  border:7px solid #3b2713;
  text-align:center;
  color:#f9e7c9;
}

.radio-title {
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
}

.light {
  width:20px;height:20px;
  background:#800;
  border-radius:50%;
  margin:10px auto 20px;
  box-shadow:0 0 10px #b00;
}
.light.on {
  background:#3aff57;
  box-shadow:0 0 12px #3aff57;
}

.btn-pp {
  width:95px;height:95px;
  background:#c49b63;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:30px;
  margin:20px auto;
  box-shadow:0 0 10px rgba(0,0,0,.6), inset 0 0 12px rgba(255,255,255,.3);
}

.vu-container {
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:25px;
}
.led {
  width:8px;
  height:30px;
  background:#330000;
  border-radius:3px;
}
</style>
</head>

<body>

<div class="radio-box">
  <div class="radio-title">📻 Musik Nostalgia</div>
  <div id="lamp" class="light"></div>
  <div id="ppBtn" class="btn-pp">▶</div>

  <div class="vu-container">
    <div class="led"></div><div class="led"></div><div class="led"></div>
    <div class="led"></div><div class="led"></div><div class="led"></div>
    <div class="led"></div><div class="led"></div><div class="led"></div>
  </div>

  <!-- autoplay + muted -->
  <audio id="radio"
         src="https://b.alhastream.com:5044/radio"
         preload="auto"
         autoplay
         playsinline
         crossorigin="anonymous">
  </audio>
</div>

<script>
const audio = document.getElementById("radio");
const btn   = document.getElementById("ppBtn");
const lamp  = document.getElementById("lamp");
const leds  = document.querySelectorAll(".led");

let audioCtx, analyser, dataArray;
let isPlaying = false;

// === SETUP AUDIO CONTEXT ===
function setupAudio(){
  if(audioCtx) return;
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
  animateVU();
}

// === AUTOPLAY HACK (MUTED → UNMUTE) ===
window.addEventListener("load", () => {
  audio.play().then(()=>{
    setupAudio();
    lamp.classList.add("on");
    btn.textContent = "⏸";
    isPlaying = true;

    // buka suara setelah aman
    setTimeout(()=> audio.muted = false, 500);
  }).catch(()=>{
    // fallback: klik di mana saja
    document.body.addEventListener("click", unlockOnce, {once:true});
  });
});

function unlockOnce(){
  audio.muted = false;
  audio.play();
  setupAudio();
  lamp.classList.add("on");
  btn.textContent = "⏸";
  isPlaying = true;
}

// === PLAY / PAUSE ===
btn.onclick = ()=>{
  setupAudio();
  if(!isPlaying){
    audio.muted = false;
    audio.play();
    lamp.classList.add("on");
    btn.textContent="⏸";
    isPlaying=true;
  }else{
    audio.pause();
    lamp.classList.remove("on");
    btn.textContent="▶";
    isPlaying=false;
  }
};

// === VU METER ===
function animateVU(){
  requestAnimationFrame(animateVU);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  leds.forEach((led,i)=>{
    const v=dataArray[i]||0;
    led.style.height=(10+(v/255)*30)+"px";
    led.style.background = v>180?"#3aff57":v>100?"#ff4444":"#224400";
  });
}
</script>

</body>
</html>
