<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio Vintage</title>

<style>

body{
background:#161616;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial;
}

/* RADIO BODY */

.radio{
width:560px;
height:330px;
background:linear-gradient(#7c5329,#4b2f16);
border-radius:25px;
border:8px solid #2a170c;
box-shadow:
0 0 40px rgba(0,0,0,.9),
inset 0 0 40px rgba(0,0,0,.6);
padding:20px;
color:#ffe7b3;
position:relative;
}

/* TITLE */

.title{
text-align:center;
font-size:26px;
font-weight:bold;
letter-spacing:2px;
}

/* TUBE LIGHT */

.tube{
position:absolute;
top:18px;
left:20px;
width:22px;
height:22px;
border-radius:50%;
background:#400;
box-shadow:0 0 8px #600;
}

.tube.on{
background:#ffb347;
box-shadow:0 0 20px #ffb347;
}

/* DIAL */

.dial{
width:320px;
height:90px;
margin-top:15px;
background:#0e0e0e;
border-radius:12px;
border:3px solid #000;
position:relative;
overflow:hidden;
}

/* SCALE */

.scale{
position:absolute;
width:200%;
height:100%;
background:
repeating-linear-gradient(
to right,
transparent,
transparent 28px,
#aaa 30px
);
opacity:.7;
}

/* NEEDLE */

.needle{
position:absolute;
left:50%;
top:0;
width:3px;
height:100%;
background:#ff3333;
box-shadow:0 0 8px red;
transition:0.3s;
}

/* SPEAKER */

.speaker{
position:absolute;
right:25px;
top:80px;
width:150px;
height:150px;
border-radius:50%;
background:radial-gradient(#222,#000);
box-shadow:
inset 0 0 20px #000;
}

/* SPEAKER PULSE */

.speaker.pulse{
animation:speak 0.15s infinite alternate;
}

@keyframes speak{
from{transform:scale(1)}
to{transform:scale(1.02)}
}

/* PLAY BUTTON */

.play{
margin-top:18px;
width:90px;
height:90px;
background:#c49b63;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
cursor:pointer;
box-shadow:
0 0 10px #000,
inset 0 0 12px rgba(255,255,255,.3);
}

/* KNOB */

.knob{
position:absolute;
bottom:20px;
right:40px;
width:60px;
height:60px;
border-radius:50%;
background:radial-gradient(#bbb,#555);
box-shadow:
0 0 10px #000,
inset 0 0 6px #fff;
cursor:pointer;
}

.knob:after{
content:"";
position:absolute;
top:10px;
left:28px;
width:4px;
height:18px;
background:#222;
}

/* SONG TEXT */

.song{
margin-top:10px;
font-size:14px;
overflow:hidden;
white-space:nowrap;
}

.song span{
display:inline-block;
padding-left:100%;
animation:scroll 12s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* VU */

.vu{
display:flex;
gap:4px;
margin-top:10px;
}

.led{
width:7px;
height:20px;
background:#330000;
border-radius:2px;
transition:0.1s;
}

</style>
</head>

<body>

<div class="radio">

<div id="tube" class="tube"></div>

<div class="title">📻 HAZA RADIO</div>

<div class="dial">
<div class="scale"></div>
<div id="needle" class="needle"></div>
</div>

<div style="display:flex;gap:20px;align-items:center">

<div id="playBtn" class="play">▶</div>

<div>

<div id="status">Siap Memutar</div>

<div class="song">
<span id="songTitle">Haza Radio Nostalgia Indonesia</span>
</div>

<div class="vu">
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
<div class="led"></div>
</div>

</div>

</div>

<div id="speaker" class="speaker"></div>

<div id="knob" class="knob"></div>

<audio id="audio" preload="none"></audio>

</div>

<script>

const STREAM="https://b.alhastream.com:5044/radio";

const audio=document.getElementById("audio");
const btn=document.getElementById("playBtn");
const tube=document.getElementById("tube");
const needle=document.getElementById("needle");
const speaker=document.getElementById("speaker");
const knob=document.getElementById("knob");

const leds=document.querySelectorAll(".led");

let ctx, analyser, data;

audio.src=STREAM;

// PLAY BUTTON

btn.onclick=async()=>{

if(!ctx){

ctx=new AudioContext();

const src=ctx.createMediaElementSource(audio);

analyser=ctx.createAnalyser();
analyser.fftSize=64;

data=new Uint8Array(analyser.frequencyBinCount);

src.connect(analyser);
analyser.connect(ctx.destination);

animate();

}

if(audio.paused){

await audio.play();

btn.textContent="❚❚";

tube.classList.add("on");

speaker.classList.add("pulse");

document.getElementById("status").textContent="🔴 LIVE";

moveNeedle();

}else{

audio.pause();

btn.textContent="▶";

tube.classList.remove("on");

speaker.classList.remove("pulse");

document.getElementById("status").textContent="⏸ Pause";

}

};

// NEEDLE ANIMATION

function moveNeedle(){

setInterval(()=>{

if(!audio.paused){

let pos=45+Math.random()*10;

needle.style.left=pos+"%";

}

},800);

}

// VU METER

function animate(){

requestAnimationFrame(animate);

if(!analyser) return;

analyser.getByteFrequencyData(data);

leds.forEach((led,i)=>{

let v=data[i];

led.style.height=(10+(v/255)*25)+"px";

led.style.background=
v>200?"#33ff33":
v>140?"#ff0000":
v>80?"#ffaa00":
"#330000";

});

}

// VOLUME KNOB

let angle=0;

knob.onwheel=(e)=>{

e.preventDefault();

angle+=e.deltaY>0?-5:5;

angle=Math.max(-135,Math.min(135,angle));

knob.style.transform="rotate("+angle+"deg)";

let vol=(angle+135)/270;

audio.volume=vol;

};

</script>

</body>
</html>
