<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Haza Radio — Premium Wooden Player</title>

<style>
body {
  background:#222;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* === Radio Premium Box === */
.radio-box {
  width: 460px;
  padding: 30px;
  border-radius: 25px;
  background: url('https://bambangw.github.io/radio-stream/logo2.jpg');
  background-size: cover;
  background-position:center;
  box-shadow:
    0 0 25px rgba(0,0,0,.6),
    inset 0 0 40px rgba(0,0,0,.4);
  border: 7px solid #3b2713;
  text-align:center;
  color:#f9e7c9;
}

/* === Judul === */
.radio-title {
  font-size:26px;
  font-weight:bold;
  margin-bottom:10px;
  text-shadow:0 0 5px rgba(0,0,0,.7);
}

/* === Lampu indikator === */
.light {
  width:20px;
  height:20px;
  background:#800;
  border-radius:50%;
  margin:10px auto 20px;
  box-shadow:0 0 10px #b00;
}

.light.on {
  background:#3aff57;
  box-shadow:0 0 12px #3aff57;
}

/* === Tombol Play/Pause === */
.btn-pp {
  width:95px;
  height:95px;
  background:#c49b63;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:30px;
  box-shadow:
    0 0 10px rgba(0,0,0,.6),
    inset 0 0 12px rgba(255,255,255,.3);
  margin:20px auto;
  color:white;
  transition:.2s;
}

.btn-pp:hover {
  transform:scale(1.08);
}

/* === VU METER LED === */
.vu-container {
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:25px;
}

.led {
  width:8px;
  height:30px;
  background:#330000;
  border-radius:3px;
  transition:height .1s ease, background .1s ease;
  box-shadow:0 0 3px #000;
}


/* === CHAT BOX === */
.chat-box {
  background: rgba(0,0,0,0.35);
  margin-top: 25px;
  padding: 18px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.15);
  box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
  color: #fff;
}

.chat-title {
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
  text-align:center;
}

.chat-window {
  background: rgba(0,0,0,0.45);
  height:180px;
  overflow-y:auto;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  font-size:14px;
  scroll-behavior:smooth;
}

.chat-msg {
  padding:6px 0;
  border-bottom:1px dashed rgba(255,255,255,0.1);
}

.chat-input-area {
  display:flex;
  gap:8px;
  margin-top:12px;
}

.chat-input {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:15px;
}

.chat-btn {
  padding:10px 16px;
  background:#3aff57;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:#000;
}
.chat-btn:hover {
  transform:scale(1.05);
}



</style>
</head>

<body>

<div class="radio-box">

  <div class="radio-title">📻 Haza Radio Premium</div>

  <div id="lamp" class="light"></div>

  <div id="ppBtn" class="btn-pp">▶</div>

  <!-- VU METER -->
  <div class="vu-container">
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
  </div>

  <audio id="radio" preload="auto" crossorigin="anonymous"></audio>

</div>



<div class="chat-box">
  <div class="chat-title">💬 Ruang Sapa Pendengar</div>

  <div id="chatWindow" class="chat-window"></div>

  <div class="chat-input-area">
    <input id="chatInput" type="text" class="chat-input" placeholder="Tulis pesan Anda...">
    <button id="chatSend" class="chat-btn">Kirim</button>
  </div>
</div>




<script>
// === KONFIGURASI ===
const STREAM_URL = "https://b.alhastream.com:5044/radio";
const RETRY_DELAY = 3000;

const audio = document.getElementById("radio");
audio.src = STREAM_URL;

let audioCtx, sourceNode, analyser, dataArray;
let isPlaying = false;

let lamp = document.getElementById("lamp");
let btn = document.getElementById("ppBtn");
let leds = document.querySelectorAll(".led");

// === START / PAUSE ===
btn.onclick = () => {
  if (!audioCtx) {
    setupAudio();
  }

  if (!isPlaying) {
    audio.play();
    lamp.classList.add("on");
    btn.textContent = "⏸";
    isPlaying = true;
  } else {
    audio.pause();
    lamp.classList.remove("on");
    btn.textContent = "▶";
    isPlaying = false;
  }
};

// === SETUP AUDIO + ANALYSER (VU METER) ===
function setupAudio() {
  audioCtx = new AudioContext({ latencyHint:"playback" });
  sourceNode = audioCtx.createMediaElementSource(audio);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;

  dataArray = new Uint8Array(analyser.frequencyBinCount);

  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  animateVU();
}

// === ANIMATE VU METER ===
function animateVU() {
  requestAnimationFrame(animateVU);

  if (!analyser) return;

  analyser.getByteFrequencyData(dataArray);
  let slice = dataArray.slice(0, leds.length);

  slice.forEach((val, i) => {
    let h = (val / 255) * 30;
    leds[i].style.height = (10 + h) + "px";

    leds[i].style.background = val > 180 ? "#ff0000" :
                               val > 120 ? "#ffaa00" :
                               val > 60  ? "#33ff33" :
                                           "#225500";
  });
}

// === RECONNECT ===
function reconnect() {
  lamp.classList.remove("on");
  isPlaying = false;
  btn.textContent = "▶";

  audio.pause();
  audio.src = STREAM_URL;
  audio.load();

  setTimeout(() => {
    audio.play().then(() => {
      lamp.classList.add("on");
      btn.textContent = "⏸";
      isPlaying = true;
    });
  }, 700);
}

// === DETEKSI GANGGUAN ===
audio.addEventListener("error", () => setTimeout(reconnect, RETRY_DELAY));
audio.addEventListener("stalled", () => setTimeout(reconnect, RETRY_DELAY));
audio.addEventListener("ended", () => setTimeout(reconnect, RETRY_DELAY));

// === KEEP ALIVE ===
setInterval(() => {
  if (audio.readyState < 2 || audio.paused) reconnect();
}, 10000);


// ==== CHAT SYSTEM LOCAL ====
const chatWindow = document.getElementById("chatWindow");
const chatInput = document.getElementById("chatInput");
const chatSend = document.getElementById("chatSend");

function addChatMessage(text) {
  if (text.trim() === "") return;

  let time = new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });

  let div = document.createElement("div");
  div.className = "chat-msg";
  div.innerHTML = `<b>Pendengar:</b> ${text} <span style="color:#8f8f8f; float:right">${time}</span>`;

  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  chatInput.value = "";
}

chatSend.onclick = () => addChatMessage(chatInput.value);
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter") addChatMessage(chatInput.value);
});



</script>

</body>
</html>
